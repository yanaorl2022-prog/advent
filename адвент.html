<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Еко-Адвент Календар | Друге життя речей</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/comfortaa@5.0.18/index.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/caveat@5.0.17/index.min.css">
<style>
  body {
    font-family: 'Comfortaa', sans-serif;
    background: linear-gradient(135deg, #a8e6cf 0%, #dcedc1 50%, #ffd3b6 100%);
    min-height: 100vh;
    overflow-x: hidden;
  }
  .handwritten { font-family: 'Caveat', cursive; }
  
  .cell {
    position: relative;
    aspect-ratio: 1;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    transform-style: preserve-3d;
  }
  .cell:hover {
    transform: scale(1.08) rotate(-2deg);
    z-index: 10;
  }
  .cell.opened {
    opacity: 0.7;
  }
  .cell.opened:hover {
    transform: scale(1.05);
  }
  .cell-face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 1rem;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15), inset 0 -4px 0 rgba(0,0,0,0.1);
    backface-visibility: hidden;
    transition: all 0.6s;
  }
  .cell-front {
    background: linear-gradient(135deg, var(--c1), var(--c2));
    border: 3px dashed rgba(255,255,255,0.5);
  }
  .cell-back {
    background: linear-gradient(135deg, #fff9e6, #ffe8cc);
    transform: rotateY(180deg);
    border: 3px solid #8bc34a;
  }
  .cell.opened .cell-front { transform: rotateY(-180deg); }
  .cell.opened .cell-back { transform: rotateY(0deg); }
  
  .day-num {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 900;
    color: white;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }
  
  .icon {
    font-size: clamp(1.5rem, 3vw, 2.2rem);
  }
  
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(46, 90, 56, 0.7);
    backdrop-filter: blur(8px);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-content {
    background: linear-gradient(135deg, #fffef7, #f5f0dc);
    border-radius: 1.5rem;
    max-width: 600px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 2rem;
    position: relative;
    transform: scale(0.8) translateY(20px);
    transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    border: 4px solid #8bc34a;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal-overlay.active .modal-content {
    transform: scale(1) translateY(0);
  }
  .modal-content::-webkit-scrollbar { width: 8px; }
  .modal-content::-webkit-scrollbar-track { background: #f0f0f0; border-radius: 4px; }
  .modal-content::-webkit-scrollbar-thumb { background: #8bc34a; border-radius: 4px; }
  
  .leaf {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
  }
  
  .progress-fill {
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  }
  
  .btn-done {
    background: linear-gradient(135deg, #8bc34a, #4caf50);
    transition: all 0.3s;
  }
  .btn-done:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(76, 175, 80, 0.4);
  }
  .btn-done.completed {
    background: linear-gradient(135deg, #ffd54f, #ffb300);
  }
  
  .confetti {
    position: fixed;
    width: 10px;
    height: 10px;
    pointer-events: none;
    z-index: 200;
    animation: confetti-fall 3s ease-out forwards;
  }
  @keyframes confetti-fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
  
  .pulse {
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.05); }
  }
  
  .title-glow {
    text-shadow: 0 0 20px rgba(255,255,255,0.8), 3px 3px 0 #2e5a38;
  }
</style>
</head>
<body class="pb-12">

<!-- Падаюче листя -->
<div id="leaves"></div>

<!-- Header -->
<header class="relative z-10 pt-8 pb-6 px-4 text-center">
  <div class="inline-block bg-white/60 backdrop-blur-sm rounded-3xl px-6 py-4 shadow-xl border-4 border-green-600">
    <h1 class="text-3xl md:text-5xl font-black text-green-800 title-glow mb-2">
      ♻️ Еко-Адвент Календар ♻️
    </h1>
    <p class="handwritten text-xl md:text-2xl text-amber-800">
      Друге життя речей · 24 творчі завдання
    </p>
  </div>
  
  <!-- Прогрес -->
  <div class="max-w-2xl mx-auto mt-6 bg-white/70 backdrop-blur-sm rounded-2xl p-4 shadow-lg border-2 border-green-500">
    <div class="flex justify-between items-center mb-2">
      <span class="text-green-800 font-bold">Твій прогрес:</span>
      <span id="progressText" class="text-green-800 font-bold">0 / 24 завдань</span>
    </div>
    <div class="w-full bg-gray-200 rounded-full h-5 overflow-hidden">
      <div id="progressBar" class="progress-fill h-full bg-gradient-to-r from-green-400 via-emerald-500 to-teal-500 rounded-full flex items-center justify-end pr-2" style="width: 0%">
        <span id="progressEmoji" class="text-xs"></span>
      </div>
    </div>
    <div class="flex justify-between mt-2 text-xs text-gray-600">
      <span>🌱 Початківець</span>
      <span>🌿 Майстер</span>
      <span>🌳 Еко-герой</span>
    </div>
  </div>
  
  <button onclick="resetProgress()" class="mt-4 text-xs text-red-600 hover:text-red-800 underline">
    🔄 Скинути прогрес
  </button>
</header>

<!-- Сітка адвент-календаря -->
<main class="relative z-10 max-w-6xl mx-auto px-4">
  <div id="calendar" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-3 md:gap-4">
  </div>
</main>

<!-- Footer -->
<footer class="relative z-10 text-center mt-12 px-4">
  <div class="inline-block bg-white/60 backdrop-blur-sm rounded-2xl px-6 py-3 shadow-lg border-2 border-green-500">
    <p class="handwritten text-lg text-green-800">
      💚 Пам'ятай: сміття — це ресурс, якому потрібна твоя уява! 💚
    </p>
  </div>
</footer>

<!-- Модальне вікно -->
<div id="modal" class="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal-content">
    <button onclick="closeModal()" class="absolute top-3 right-3 w-10 h-10 rounded-full bg-red-400 hover:bg-red-500 text-white text-2xl font-bold shadow-lg transition">
      ×
    </button>
    <div id="modalBody"></div>
  </div>
</div>

const STORAGE_KEY = 'eco-advent-progress';
let completed = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');

// Створення клітинок
const calendar = document.getElementById('calendar');
tasks.forEach(task => {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.setProperty('--c1', task.color[0]);
  cell.style.setProperty('--c2', task.color[1]);
  if (completed.includes(task.day)) cell.classList.add('opened');
  
  cell.innerHTML = `
    <div class="cell-face cell-front">
      <div class="text-center">
        <div class="icon mb-1">${task.icon}</div>
        <div class="day-num">${task.day}</div>
      </div>
    </div>
    <div class="cell-face cell-back">
      <div class="text-center">
        <div class="icon mb-1">${task.icon}</div>
        <div class="text-2xl font-black text-green-700">${task.day}</div>
        <div class="text-xs text-green-600 mt-1">✓</div>
      </div>
    </div>
  `;
  
  cell.addEventListener('click', () => openModal(task));
  calendar.appendChild(cell);
});

// Модальне вікно
function openModal(task) {
  const isCompleted = completed.includes(task.day);
  const modal = document.getElementById('modal');
  const body = document.getElementById('modalBody');
  
  body.innerHTML = `
    <div class="text-center mb-4">
      <div class="inline-block text-6xl mb-2 pulse">${task.icon}</div>
      <div class="inline-block bg-green-100 text-green-800 px-3 py-1 rounded-full text-sm font-bold">
        День ${task.day}
      </div>
    </div>
    <h2 class="text-2xl md:text-3xl font-black text-center text-green-800 mb-3">${task.title}</h2>
    <p class="text-center text-gray-700 mb-5 text-lg">${task.desc}</p>
    
    <div class="bg-amber-50 rounded-xl p-4 mb-4 border-2 border-amber-200">
      <h3 class="font-bold text-amber-800 mb-2">📦 Що потрібно:</h3>
      <ul class="list-disc list-inside text-gray-700 space-y-1">
        ${task.materials.map(m => `<li>${m}</li>`).join('')}
      </ul>
    </div>
    
    <div class="bg-green-50 rounded-xl p-4 mb-4 border-2 border-green-200">
      <h3 class="font-bold text-green-800 mb-2">🛠️ Як робити:</h3>
      <ol class="list-decimal list-inside text-gray-700 space-y-2">
        ${task.steps.map(s => `<li>${s}</li>`).join('')}
      </ol>
    </div>
    
    <div class="bg-blue-50 rounded-xl p-3 mb-5 border-2 border-blue-200">
      <p class="text-blue-800 text-sm">${task.tip}</p>
    </div>
    
    <button onclick="toggleComplete(${task.day})" 
            class="btn-done w-full py-3 rounded-xl text-white font-bold text-lg shadow-lg ${isCompleted ? 'completed' : ''}">
      ${isCompleted ? '⭐ Завдання виконано! (натисни, щоб скасувати)' : '✅ Я зробив/зробила це!'}
    </button>
  `;
  
  modal.classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function toggleComplete(day) {
  const idx = completed.indexOf(day);
  if (idx > -1) {
    completed.splice(idx, 1);
  } else {
    completed.push(day);
    launchConfetti();
  }
  localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
  updateProgress();
  updateCells();
  closeModal();
}

function updateCells() {
  document.querySelectorAll('.cell').forEach((cell, i) => {
    const day = tasks[i].day;
    if (completed.includes(day)) {
      cell.classList.add('opened');
    } else {
      cell.classList.remove('opened');
    }
  });
}

function updateProgress() {
  const count = completed.length;
  const percent = (count / 24) * 100;
  document.getElementById('progressBar').style.width = percent + '%';
  document.getElementById('progressText').textContent = `${count} / 24 завдань`;
  
  let emoji = '';
  if (count >= 24) emoji = '🏆';
  else if (count >= 16) emoji = '🌳';
  else if (count >= 8) emoji = '🌿';
  else if (count > 0) emoji = '🌱';
  document.getElementById('progressEmoji').textContent = emoji;
}

function resetProgress() {
  if (confirm('Ти впевнений/на, що хочеш скинути весь прогрес?')) {
    completed = [];
    localStorage.setItem(STORAGE_KEY, JSON.stringify(completed));
    updateProgress();
    updateCells();
  }
}

function launchConfetti() {
  const colors = ['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#f368e0','#ff9ff3'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDelay = Math.random() * 0.5 + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3500);
  }
}

// Падаюче листя
function createLeaves() {
  const container = document.getElementById('leaves');
  const leafEmojis = ['🍃','🌿','☘️','🍀','🌱'];
  for (let i = 0; i < 15; i++) {
    const leaf = document.createElement('div');
    leaf.className = 'leaf';
    leaf.textContent = leafEmojis[Math.floor(Math.random() * leafEmojis.length)];
    leaf.style.left = Math.random() * 100 + 'vw';
    leaf.style.fontSize = (Math.random() * 20 + 15) + 'px';
    leaf.style.animationDuration = (Math.random() * 10 + 10) + 's';
    leaf.style.animationDelay = (Math.random() * 20) + 's';
    container.appendChild(leaf);
  }
}
createLeaves();

// ESC для закриття
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

updateProgress();
updateCells();
</script>
